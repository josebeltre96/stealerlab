title: Exfiltracion generica - conexion saliente de proceso no-navegador
id: 7e468754-a02b-4fb3-b6fd-9400f5b99ee5
status: experimental
description: Heuristica de comportamiento - conexion saliente (80/443) de proceso no-navegador fuera de rutas del sistema. NO incorpora correlacion temporal con la resolucion DNS previa; indicador de cobertura amplia.
author: J. A. Beltre Castro
date: 2026/08/22
tags:
    - attack.exfiltration
    - attack.t1041
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Initiated: 'true'
        DestinationPort:
            - 80
            - 443
    filter_browsers:
        Image|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\iexplore.exe'
    filter_system:
        Image|startswith:
            - 'C:\Windows\'
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
    condition: selection and not filter_browsers and not filter_system
falsepositives:
    - Numerosas aplicaciones legitimas no-navegador. Regla de cobertura amplia, requiere triaje.
level: low
