title: LummaC2 - consulta al dominio C2 exacto
id: 678832b1-85ed-4cf3-aad5-778800b5b795
status: experimental
description: Detecta la consulta DNS al dominio C2 exacto observado (grzpoint.cyou). El TLD .cyou por si solo es indicador debil; la regla apunta al dominio concreto.
author: J. A. Beltre Castro
date: 2026/08/22
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-141b
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: dns_query
    product: windows
detection:
    selection_exact:
        QueryName: 'grzpoint.cyou'
    condition: selection_exact
falsepositives:
    - Ninguno para el dominio exacto. No alertar solo por el TLD .cyou (alto ruido).
level: high
